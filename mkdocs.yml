
site_name: 我的知识库
site_description: 个人技术文档与知识库

# 直接读取现有仓库目录中的 Markdown 和图片
docs_dir: .

# Cloudflare Pages 发布目录
site_dir: site

theme:
  name: material
  language: zh

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences

# 不把仓库管理文件当作文档发布
exclude_docs: |
  .git/
  .github/
  .vscode/
  .idea/
  site/
  mkdocs.yml
  .gitignore
  LICENSE
  requirements.txt
